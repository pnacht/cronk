# -*- protobuffer -*-
# proto-file: google3/devtools/kokoro/config/proto/build.proto
# proto-message: BuildConfig

# Location of the script under depot.
build_file: "cronk/.kokoro/build.sh"
container_properties {
  # Between the available images, it's the one with latest version of GO, namely go1.20.4 (default)
  docker_image: "us-central1-docker.pkg.dev/kokoro-container-bakery/kokoro/ubuntu/ubuntu2204/full:current"
}
fileset_artifacts {
  name: "wheel"
  artifact_globs: "**/*.whl"
  artifact_globs: "**/*.tar.gz"
  error_if_missing: true
  destinations {
    store_attestation: true
    gcs {
      gcs_root_path: "oss-exit-gate-$[ENV]-projects-bucket/cronk/$[REGISTRY]/attestations"
    }
  }
  generate_sbom_from_fileset: false
  generate_attestation: true
}

build_params {
  key: "ENV"
  value: "dev"
}

build_params {
  key: "REGISTRY"
  value: "testpypi"
}

env_vars {
  key: "ENV"
  value: "$[ENV]"
}

env_vars {
  key: "REGISTRY"
  value: "$[REGISTRY]"
}
